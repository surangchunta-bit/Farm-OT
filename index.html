:root{
  --bg:#FFF8E8; --primary:#FFB84D; --green:#7BC96F; --sky:#7DD3FC;
  --pink:#FF8FAB; --purple:#A78BFA; --gold:#FFD166; --text:#3D3D3D;
  --line:#EADFC6; --wood:#C98A5B; --woodD:#8B562F;
  --sky1:#8FD8FF; --sky2:#D9F2FF; --sun:#FFD166; --sunGlow:.30;
  --g1:#8FD07A; --g2:#6BBE5E; --g3:#57A84B; --veil:0; --lit:0;
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#20303a;color:var(--text);
  font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.num{font-family:'Fredoka',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:0}

/* ============ shell ============ */
.app{position:fixed;inset:0;max-width:430px;margin:0 auto;overflow:hidden;background:#BFE9FF;
  box-shadow:0 0 50px rgba(0,0,0,.35)}
/* time themes */
.app.t-day  {--sky1:#7FD2FF;--sky2:#DFF6FF;--sun:#FFD86B;--sunGlow:.30;--g1:#93D67F;--g2:#6BBE5E;--g3:#57A84B;--veil:0;--lit:0}
.app.t-eve  {--sky1:#FF9E6B;--sky2:#FFE0B0;--sun:#FF8F5E;--sunGlow:.45;--g1:#8FBE72;--g2:#69A455;--g3:#4F8A43;--veil:.14;--lit:.85}
.app.t-night{--sky1:#1B2A5E;--sky2:#4A5FA8;--sun:#FFF3C4;--sunGlow:.22;--g1:#4C7A55;--g2:#3B6544;--g3:#2E5237;--veil:.34;--lit:1}

/* ============ farm scene ============ */
#farmSvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#farmSvg text{font-family:'Mali',sans-serif;-webkit-user-select:none}
.veil{transition:opacity .9s}
.stars,.ff{opacity:0;transition:opacity 1s}
.t-night .stars,.t-night .ff{opacity:1}
.win{opacity:0;transition:opacity .8s}
.app.t-eve .win,.app.t-night .win{opacity:1}

/* spot = tappable building */
.spot{cursor:pointer}
.spot .art{transform-box:fill-box;transform-origin:bottom center;transition:transform .12s}
.spot:active .art{transform:scale(.94)}
.tagbg{fill:#fff;stroke:#E0CFAB;stroke-width:2}
.tagtx{font-size:11.5px;font-weight:700;fill:#5B4A2E;text-anchor:middle;dominant-baseline:middle}
.ping{fill:none;stroke:#FFF0B8;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}

/* ambient animation */
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(470px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.75}100%{transform:translate(-16px,-40px) scale(1.5);opacity:0}}
@keyframes wheel{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fly{0%{transform:translate(0,0);opacity:0}
  20%{opacity:1}80%{opacity:1}100%{transform:translate(24px,-30px);opacity:0}}
@keyframes peck{0%,100%{transform:rotate(0)}45%{transform:rotate(16deg)}}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}45%{transform:translateX(52px) scaleX(1)}
  50%{transform:translateX(52px) scaleX(-1)}95%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes pingA{0%{opacity:.85;transform:scale(.55)}70%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
@keyframes rain{to{transform:translateY(120px)}}
.cloud{animation:drift linear infinite}
.swayer{transform-box:fill-box;transform-origin:bottom center;animation:sway 4.6s ease-in-out infinite}
.bobber{transform-box:fill-box;animation:bob 3.1s ease-in-out infinite}
.smoke circle{transform-box:fill-box;animation:puff 3.4s ease-out infinite}
.tyre{transform-box:fill-box;transform-origin:center;animation:wheel 3.2s linear infinite}
.star{animation:twinkle 3s ease-in-out infinite}
.ffdot{transform-box:fill-box;animation:fly 4.2s ease-in-out infinite}
.hen{transform-box:fill-box;transform-origin:bottom center;animation:peck 2.4s ease-in-out infinite}
.mascot{transform-box:fill-box;animation:walk 13s ease-in-out infinite}
.mascot .body{transform-box:fill-box;animation:bob 1.1s ease-in-out infinite}
.rainline{animation:rain .7s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ============ HUD ============ */
.hud{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;
  display:flex;gap:7px;align-items:center;z-index:20;pointer-events:none}
.chipHud{background:rgba(255,253,244,.94);border:2.5px solid #E3A63F;border-radius:999px;
  padding:4px 11px 4px 6px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;
  box-shadow:0 3px 0 rgba(160,110,40,.35)}
.chipHud .e{font-size:15px}
.chipHud.coin{border-color:#E3A63F}
.wx{margin-left:auto;background:rgba(255,253,244,.9);border:2.5px solid #E3A63F;border-radius:999px;
  width:36px;height:36px;display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 rgba(160,110,40,.35)}
.lvbar{position:absolute;left:0;right:0;bottom:-6px;height:4px;background:#F0E4CB;border-radius:9px;overflow:hidden}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD166,#FF9E3D)}

/* ============ nav ============ */
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safeB));
  display:flex;align-items:center;gap:2px;background:rgba(255,253,244,.96);border:3px solid #E0CFAB;
  border-radius:999px;padding:5px 7px;z-index:30;box-shadow:0 5px 0 rgba(120,85,40,.28);max-width:96vw}
.nav button{flex:0 0 auto;background:none;border-radius:999px;padding:8px 11px;font-size:11.5px;
  font-weight:700;color:#A2937A;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  line-height:1;white-space:nowrap}
.nav button .e{font-size:15px;line-height:1;display:block;filter:grayscale(.85);opacity:.55}
.nav button .t{line-height:1;display:block;transform:translateY(.5px)}
.nav button.on{background:var(--primary);color:#fff;box-shadow:0 3px 0 #D9932E}
.nav button.on .e{filter:none;opacity:1}
.nav .scanBtn{width:56px;height:56px;border-radius:50%;padding:0;margin:-17px 5px 0;flex:0 0 56px;
  display:grid;place-items:center;background:linear-gradient(180deg,#FFC366,#FFA92E);
  box-shadow:0 5px 0 #D9832A,0 0 0 4px rgba(255,253,244,.96)}
.nav .scanBtn .si{font-size:24px;line-height:1;display:block;transform:translateY(1px)}
.nav .scanBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #D9832A,0 0 0 4px rgba(255,253,244,.96)}
@media (max-width:389px){
  .nav button{padding:9px 10px;gap:0}
  .nav button .t{display:none}
  .nav button .e{font-size:19px;opacity:.7}
  .nav .scanBtn{margin:-17px 3px 0}
}

/* ============ sheets ============ */
.scrim{position:absolute;inset:0;background:rgba(35,25,12,.55);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:45;background:var(--bg);
  border-radius:30px 30px 0 0;border-top:5px solid #fff;max-height:86%;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet.on{transform:translateY(0)}
.sheetHead{padding:12px 18px 8px;position:relative;flex:none}
.grip{width:44px;height:5px;border-radius:9px;background:#E0CFAB;margin:0 auto 10px}
.sheetHead h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.sheetBody{padding:4px 16px calc(26px + var(--safeB));overflow:auto;-webkit-overflow-scrolling:touch}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#fff;
  border:2.5px solid var(--line);font-size:16px;color:#8A7A5A;display:grid;place-items:center}

/* ============ game UI bits ============ */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:20px;padding:12px 13px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.tile .lab{font-size:11.5px;font-weight:700;opacity:.8}
.tile .val{font-size:23px;font-weight:700;line-height:1.25;letter-spacing:-.5px}
.tile.gold{background:linear-gradient(180deg,#FFE6A8,#FFD066);color:#7A5210}
.tile.fire{background:linear-gradient(180deg,#FFC7A3,#FF9E6B);color:#7A3610}
.tile.spend{background:linear-gradient(180deg,#FFC3CE,#FF9DB1);color:#7A1E33}
.tile.heart{background:linear-gradient(180deg,#CDEFC4,#9BDE8C);color:#2C5C25}
.tile.wide{grid-column:1/-1}
.sign{background:linear-gradient(180deg,#D89A67,#BE7C4A);border:4px solid #A66B41;border-radius:18px;
  color:#FFF6E4;padding:11px 14px;font-weight:700;text-align:center;box-shadow:0 5px 0 var(--woodD)}
.plank{background:linear-gradient(180deg,#FFF6E2,#FFEDD0);border:3px solid #EBD6AC;border-radius:18px;
  padding:13px 15px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;
  border-bottom:2px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row b{font-family:'Fredoka';font-weight:600}
.pos{color:#3E9B4F}.neg{color:#E0555B}
.note{font-size:11.5px;color:#9A8A6A;line-height:1.55}
.bar{height:15px;background:#F0E4CB;border-radius:999px;overflow:hidden;border:2px solid #E3D3B0}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#A8E063,#6BBE5E);
  transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.pinkbar>i{background:linear-gradient(90deg,#FF8FAB,#FF6B8B)}
.btn{display:block;width:100%;border-radius:20px;padding:15px;font-size:17px;font-weight:700;color:#fff;
  background:var(--green);box-shadow:0 5px 0 #57A24C;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #57A24C}
.btn.scan{background:linear-gradient(180deg,#FFC366,#FFA92E);box-shadow:0 5px 0 #D9832A}
.btn.scan:active{box-shadow:0 1px 0 #D9832A}
.btn.ghost{background:#fff;color:var(--text);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{padding:11px;font-size:14px;border-radius:15px}
.btn2{display:flex;gap:10px}
label.f{display:block;font-size:12.5px;font-weight:700;color:#8A7A5A;margin:12px 0 5px}
input,select{width:100%;font-family:'Fredoka','Mali',sans-serif;font-size:16px;font-weight:700;
  padding:12px 14px;border:3px solid var(--line);border-radius:15px;background:#FFFDF7;color:var(--text);
  outline:none;min-height:48px}
input:focus,select:focus{border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ot{display:flex;align-items:center;gap:9px;background:#FFFDF7;border:3px solid var(--line);
  border-radius:18px;padding:9px 11px;margin-bottom:9px}
.ot .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.ot .mid{flex:1;min-width:0}.ot .nm{font-size:13px;font-weight:700;line-height:1.25}
.ot .rate{font-size:10.5px;color:#9A8A6A}
.ot input{width:74px;text-align:center;padding:9px 3px;flex:none;min-height:44px}
.ot .amt{width:70px;text-align:right;font-family:'Fredoka';font-weight:600;font-size:13.5px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:3px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.chip.on{background:var(--primary);border-color:#E3A63F;color:#fff}
.exp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--line)}
.exp .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:#FFF3D9}
.warnbox{background:#FFF3D6;border:3px solid #F0D191;border-radius:16px;padding:11px 13px;font-size:12px;line-height:1.55}

/* year view */
.yearHead{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.yearHead button{width:40px;height:40px;border-radius:14px;background:#fff;border:3px solid var(--line);
  font-size:16px;box-shadow:0 3px 0 var(--line)}
.yearHead .y{font-family:'Fredoka';font-size:27px;font-weight:700;min-width:104px;text-align:center}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.plot{background:linear-gradient(180deg,#EFD9B0,#DFC38E);border:3px solid #C9A971;border-radius:16px;
  padding:8px 6px 9px;text-align:center;box-shadow:0 4px 0 #B8945F;position:relative;overflow:hidden}
.plot.empty{background:linear-gradient(180deg,#EDE3CE,#DED2B7);border-color:#CFC0A0;box-shadow:0 4px 0 #BFB094}
.plot.cur{border-color:#FFB84D;box-shadow:0 4px 0 #D9932E}
.plot .mo{font-size:11px;font-weight:700;color:#7A5F35;letter-spacing:.5px}
.plot .pl{font-size:26px;line-height:1.25}
.plot .rm{font-family:'Fredoka';font-size:12px;font-weight:600;color:#4B3A1C}
.plot .dot{position:absolute;top:5px;right:6px;font-size:9px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.badge{background:#fff;border:3px solid var(--line);border-radius:16px;padding:9px 10px;display:flex;gap:9px;align-items:center}
.badge .bi{font-size:21px}
.badge .bt{font-size:10.5px;color:#9A8A6A;font-weight:700;line-height:1.2}
.badge .bv{font-size:13px;font-weight:700;font-family:'Fredoka'}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px 0;
  border-bottom:2px dashed var(--line)}
.cmp .side{text-align:center}
.cmp .side .k{font-size:10px;color:#9A8A6A;font-weight:700}
.cmp .side .v{font-family:'Fredoka';font-size:14px;font-weight:600}
.cmp .arw{font-size:12px;font-weight:700;font-family:'Fredoka'}
.yTree{display:grid;place-items:center;padding:6px 0 2px}

/* scanner */
.frame{position:relative;height:180px;border-radius:18px;background:#2B2417;overflow:hidden;
  display:grid;place-items:center;color:#FFE9B8;font-size:13px;font-weight:700}
.frame:before{content:'';position:absolute;inset:16px;border:3px dashed rgba(255,209,102,.85);border-radius:12px}
.laser{position:absolute;left:16px;right:16px;height:5px;border-radius:9px;
  background:linear-gradient(90deg,transparent,#FFD166,transparent);animation:scan 1.5s ease-in-out infinite}
@keyframes scan{0%,100%{top:22px}50%{top:150px}}
.conf{display:inline-block;background:#E7F7E3;color:#3E9B4F;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}

/* money board + eye */
.moneyBoard{position:absolute;top:calc(54px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  z-index:19;background:linear-gradient(180deg,#D89A67,#BE7C4A);border:4px solid #A66B41;border-radius:20px;
  padding:7px 8px 7px 15px;box-shadow:0 5px 0 var(--woodD);display:flex;align-items:center;gap:12px}
.moneyBoard .lab{font-size:10.5px;font-weight:700;color:#FFE7C4;letter-spacing:.3px}
.moneyBoard .val{font-size:27px;font-weight:700;color:#FFF6E4;line-height:1.15;letter-spacing:-.5px;min-width:118px}
.eye{width:40px;height:40px;border-radius:13px;background:rgba(255,246,228,.94);display:grid;place-items:center;
  font-size:18px;flex:none;box-shadow:0 3px 0 rgba(120,85,40,.45)}
.eye:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,85,40,.45)}

/* swipe to delete */
.sw{position:relative;overflow:hidden;border-radius:18px;margin-bottom:9px;background:#E0555B}
.sw .del{position:absolute;right:0;top:0;bottom:0;width:88px;display:grid;place-items:center;gap:1px;
  color:#fff;font-weight:700;font-size:11.5px;background:none}
.sw .del .di{font-size:18px}
.sw .fr{position:relative;transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform;
  background:#FFFDF7;border:3px solid var(--line);border-radius:18px;padding:10px 12px}
.sw.open .fr{transform:translateX(-88px)}
.swHint{font-size:11px;color:#B3A88F;font-weight:700;text-align:center;margin:2px 0 10px}
.empty{text-align:center;padding:22px 10px;color:#9A8A6A;font-size:13px;line-height:1.7}
.empty .ei{font-size:34px;display:block;margin-bottom:6px}

/* ---------- สแกนเนอร์เต็มจอ (ใช้ได้ทั้งแนวตั้งและแนวนอน) ---------- */
.scanner{position:fixed;inset:0;z-index:500;background:#0E0B08;overflow:hidden;touch-action:none}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scFrame{position:absolute;left:5%;right:5%;top:14%;bottom:26%;border:3px dashed rgba(255,209,102,.85);
  border-radius:14px;pointer-events:none;transition:border-color .2s,box-shadow .25s}
.scFrame.ready{border-color:#9BDE8C;border-style:solid;box-shadow:0 0 0 4000px rgba(62,155,79,.10)}
@media (orientation:landscape){.scFrame{top:9%;bottom:24%;left:7%;right:7%}}
.scTop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;
  display:flex;align-items:flex-start;gap:10px;z-index:6}
.scX{width:42px;height:42px;border-radius:50%;background:rgba(255,253,244,.94);font-size:17px;color:#3D3D3D;flex:none}
.scHint{flex:1;background:rgba(40,32,20,.8);color:#FFE9B8;border-radius:14px;padding:8px 12px;
  font-size:12px;font-weight:700;line-height:1.5}
.scBot{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:grid;gap:9px;justify-items:center;z-index:6}
.scPill{background:rgba(40,32,20,.9);color:#FFE9B8;border-radius:999px;padding:10px 18px;
  font-size:14px;font-weight:700;border:2.5px solid rgba(255,209,102,.5);text-align:center;
  max-width:92%;line-height:1.45;transition:.2s}
.scPill.ok{background:rgba(62,155,79,.96);color:#fff;border-color:#9BDE8C}
.scPill.warn{background:rgba(224,85,91,.94);color:#fff;border-color:#FFB3B6}
.scPill.tip{background:rgba(224,150,30,.96);color:#fff;border-color:#FFD79B}
.scMeterWrap{width:min(300px,86vw);display:grid;gap:4px;justify-items:center}
.scMeter{width:100%;height:9px;border-radius:999px;background:rgba(255,255,255,.24);overflow:hidden}
.scMeter i{display:block;height:100%;width:0;border-radius:999px;background:#FFB84D;transition:width .18s linear}
.scMeter i.ok{background:linear-gradient(90deg,#A8E063,#6BBE5E)}
.scMeterLab{font-size:11px;font-weight:700;color:#FFE9B8;opacity:.85}
.scRow{display:flex;gap:9px;align-items:center;margin-top:2px}
.scRow button{background:rgba(255,253,244,.94);border-radius:999px;padding:11px 16px;
  font-size:13px;font-weight:700;color:#3D3D3D}
.scRow .big{background:linear-gradient(180deg,#FFC366,#FFA92E);color:#fff;padding:13px 26px;font-size:15px}
.focusRing{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border:3px solid #FFD166;
  border-radius:50%;opacity:0;pointer-events:none;z-index:5}
.focusRing.go{animation:fr .75s ease-out}
@keyframes fr{0%{opacity:1;transform:scale(1.5)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}

.shotBox{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--line);background:#241E14}
.shotBox img{width:100%;display:block;max-height:230px;object-fit:cover}
.shotBox .zoomBtn{position:absolute;right:9px;bottom:9px;background:rgba(255,253,244,.95);
  border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--text);
  box-shadow:0 3px 0 rgba(120,85,40,.4)}
.zoomer{position:fixed;inset:0;z-index:400;background:#141018;display:grid;place-items:center;overflow:hidden;touch-action:none}
.zoomer img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform}
.zoomer .zx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;
  border-radius:50%;background:rgba(255,253,244,.94);font-size:17px;color:#3D3D3D}
.zoomer .zh{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
  color:#FFE9B8;font-size:12px;font-weight:700;opacity:.8}

.spin{width:44px;height:44px;border-radius:50%;margin:0 auto;
  border:5px solid #F0E4CB;border-top-color:var(--primary);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ot.uncert{border-color:#F0A63E;background:#FFF6E6;box-shadow:0 0 0 3px rgba(240,166,62,.18)}
.conf.warn{background:#FFF1D6;color:#B57A18}

/* fx */
.coin{position:fixed;width:28px;height:28px;border-radius:50%;z-index:300;pointer-events:none;
  background:radial-gradient(circle at 34% 30%,#FFE9A8,#FFC93C 60%,#E0A21B);border:2px solid #C98A18;
  display:grid;place-items:center;font-size:13px;color:#8A5A17;font-weight:700}
.conf-p{position:fixed;width:9px;height:14px;z-index:300;pointer-events:none;border-radius:2px}
.toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  z-index:310;background:rgba(50,40,25,.95);color:#fff;padding:9px 17px;border-radius:999px;font-size:13.5px;
  font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1}
</style>

  hourly(s){return (n(s.base)+n(s.col)+n(s.pos)+n(s.house))/30/8},
  hourlyPub(s,st){return st?(n(s.base)+n(s.col)+n(s.pos))/30/8:this.hourly(s)},
  rates(s,st){const bw=this.hourly(s),bp=this.hourlyPub(s,st),r={};
    this.buckets.forEach(b=>r[b.k]=(b.pub?bp:bw)*b.mult);return r},
  otPay(s,h,st){const r=this.rates(s,st);let t=0;const l={};
    this.buckets.forEach(b=>{l[b.k]=(h[b.k]||0)*r[b.k];t+=l[b.k]});return{total:t,lines:l,rates:r}},
  perDayPay(s,d){return n(d.meal)*n(s.mealRate)+n(d.otMeal)*n(s.otMealRate)+n(d.shift)*n(s.shiftRate)},
  summary(s,h,d,st,exp){
    const ot=this.otPay(s,h,st),perDay=this.perDayPay(s,d);
    const salary=n(s.base)+n(s.col)+n(s.pos)+n(s.env)+n(s.house)+n(s.dili)+n(s.bonus);
    const ded=n(s.sso)+n(s.pvd)+n(s.loan);
    const income=salary+perDay+ot.total;
    const spent=exp.reduce((a,e)=>a+e.amount,0);
    return{ot,perDay,salary,ded,income,spent,left:income-ded-spent,noOt:salary+perDay-ded-spent};}
};

/* รอบจ่าย 16 → 15 ; เดือนของรอบ = เดือนที่จบรอบ */
function cycle(){const t=new Date(),d=t.getDate();
  const st=new Date(t.getFullYear(),t.getMonth()+(d>=16?0:-1),16);
  const en=new Date(st.getFullYear(),st.getMonth()+1,15);
  return{st,en,y:en.getFullYear(),m:en.getMonth(),
    daysLeft:Math.max(1,Math.ceil((en-t)/864e5)+1),
    label:`16 ${MO[st.getMonth()]} – 15 ${MO[en.getMonth()]}`};}

function commitMonth(sum){const c=cycle();if(!YEARS[c.y])YEARS[c.y]={};
  YEARS[c.y][c.m]={income:Math.round(sum.income),expense:Math.round(sum.spent),
    ot:Math.round(sum.ot.total),ded:Math.round(sum.ded),left:Math.round(sum.left)};}

function drawGarden(){
  const tot=GOALS.reduce((a,g)=>a+g.s,0),tgt=GOALS.reduce((a,g)=>a+g.t,0)||1;
  const p=Math.min(1,tot/tgt);let s='';
  for(let i=0;i<6;i++){
    const x=30+i*17,y=592,gr=Math.max(0,Math.min(1,p*6-i));
    if(gr<=0){s+=`<ellipse cx="${x}" cy="${y}" rx="5" ry="2.6" fill="#96683B"/>`;continue}
    const hgt=6+gr*20;
    s+=`<path d="M${x} ${y} v${-hgt}" stroke="#4E9040" stroke-width="2.6" stroke-linecap="round"/>`;
    s+=`<path d="M${x} ${y-hgt*.6} q-8 -5 -1 -9 q6 3 1 9Z" fill="#6BBE5E"/>`;
    if(gr>.5)s+=`<path d="M${x} ${y-hgt*.85} q8 -5 1 -9 q-6 3 -1 9Z" fill="#7DD06A"/>`;
    if(gr>.85)s+=`<circle cx="${x}" cy="${y-hgt-3}" r="4.6" fill="#FFD166"/><circle cx="${x}" cy="${y-hgt-3}" r="2" fill="#E08A2B"/>`;
  }
  $('gardenPlants').innerHTML=s;
}

function compare(){const yr=YEARS[viewYear]||{},ms=Object.keys(yr).map(Number).sort((a,b)=>a-b);
  if(ms.length<2)return toast('ต้องมีข้อมูลอย่างน้อย 2 เดือน');
  const b=ms[ms.length-1],a=ms[ms.length-2];
  const line=(lab,k,inv)=>{const dv=yr[b][k]-yr[a][k],up=dv>=0,good=inv?!up:up;
    return `<div class="cmp"><div class="side"><div class="k">${MOE[a]}</div><div class="v">${B(yr[a][k])}</div></div>
      <div class="arw" style="color:${good?'#3E9B4F':'#E0555B'}">${up?'↑':'↓'} ${B(Math.abs(dv))}</div>
      <div class="side"><div class="k">${MOE[b]}</div><div class="v">${B(yr[b][k])}</div></div></div>
      <div class="note" style="text-align:center;margin:-4px 0 8px">${lab}</div>`};
  VIEWS.cmp=()=>({title:`⚖️ ${MOE[a]} vs ${MOE[b]}`,html:
    line('🔥 OT','ot')+line('💸 รายจ่าย','expense',1)+line('🪙 เงินเหลือ','left')+line('💰 รายรับ','income')+
    `<button class="btn ghost sm" style="margin-top:8px" onclick="openSheet('year')">← กลับไปหน้ารายปี</button>`});
  openSheet('cmp');}

function addQuick(){const el=$('quick'),t=el.value.trim();if(!t)return;
  const m=t.match(/([\d,]+(?:\.\d+)?)\s*$/)||t.match(/([\d,]+(?:\.\d+)?)/);
  if(!m)return toast('ใส่จำนวนเงินด้วยนะ');
  const amount=n(m[1].replace(/,/g,''));if(!amount)return toast('ใส่จำนวนเงินด้วยนะ');
  const label=t.replace(m[0],'').trim()||'รายจ่าย';let cat=null;
  for(const k in KW)if(KW[k].some(w=>label.toLowerCase().includes(w))){cat=k;break}
  cat=cat||$('catChips').querySelector('.chip.on').dataset.c;
  EXP.push({label,amount,cat,d:new Date().toDateString()});
  el.value='';render();save();
  toast(`${CATS.find(x=>x.k===cat).i} ${label} ${B(amount)}`);}

   กล้อง → ตรวจคุณภาพรูป → ส่งให้ AI อ่าน → เติมตัวเลขอัตโนมัติ
   ===================================================================== */
let camStream=null, shotURL=null, LASTSHOT=null, ocrErr=null;
const SHOTKEY='moneyfarm:shot';
const BLUR_MIN=55;            /* ต่ำกว่านี้ถือว่าเบลอเกินไป */
function stopCam(){if(typeof stopLive==='function')stopLive();camTrack=null;
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function loadShot(){try{LASTSHOT=localStorage.getItem(SHOTKEY)}catch(e){}}
function saveShot(){try{localStorage.setItem(SHOTKEY,shotURL)}catch(e){}LASTSHOT=shotURL}

function shrink(el,w0,h0){const M=1600;let w=w0,h=h0;
  if(!w||!h)return null;
  if(Math.max(w,h)>M){const r=M/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(el,0,0,w,h);
  return c.toDataURL('image/jpeg',0.8)}

/* วัดความคมชัดด้วย Laplacian variance + ความสว่างเฉลี่ย ทำในเครื่อง ไม่ต้องส่งขึ้นเน็ต */
function imgQuality(src){return new Promise(done=>{
  const im=new Image();
  im.onload=()=>{
    const W=420,h=Math.max(2,Math.round(im.naturalHeight/im.naturalWidth*W));
    const c=document.createElement('canvas');c.width=W;c.height=h;
    const x=c.getContext('2d');x.drawImage(im,0,0,W,h);
    const d=x.getImageData(0,0,W,h).data,g=new Float32Array(W*h);let sum=0;
    for(let i=0,p=0;i<d.length;i+=4,p++){const v=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[p]=v;sum+=v}
    const bright=sum/(W*h);let m=0,m2=0,cnt=0;
    for(let y=1;y<h-1;y++)for(let xx=1;xx<W-1;xx++){const p=y*W+xx;
      const l=4*g[p]-g[p-1]-g[p+1]-g[p-W]-g[p+W];m+=l;m2+=l*l;cnt++}
    const mean=m/cnt;
    done({blur:Math.max(0,m2/cnt-mean*mean),bright});
  };
  im.onerror=()=>done({blur:999,bright:128});
  im.src=src});}

/* ---------- สแกนเนอร์: เปิดค้างไว้ ระบบคอยดูให้เองว่าชัดพอหรือยัง ---------- */
let liveTimer=null, goodRun=0, prevGray=null, autoOn=true, busyShot=false;
let steadyBlurTicks=0, camTrack=null, scEl=null;
const NEED=5;               /* ชัดติดกันกี่เฟรมถึงถ่ายให้ (~1 วินาที) */
const LIVE_BLUR=42;         /* เกณฑ์ความคมของภาพพรีวิว */
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}
  goodRun=0;prevGray=null;steadyBlurTicks=0}
function closeScanner(){stopCam();if(scEl){scEl.remove();scEl=null}}

  el.querySelector('video').addEventListener('click',e=>tapFocus(e));
  window.addEventListener('orientationchange',orientHint);

}
function orientHint(){setTimeout(()=>{const h=$('scHint');if(!h)return;
  h.innerHTML=window.innerHeight>window.innerWidth
    ?'📄 ใบ OT เป็นแนวนอน — หมุนมือถือเป็นแนวนอนจะเห็นทั้งใบและตัวเลขใหญ่ขึ้น'
    :'วางใบให้เต็มกรอบ โดยเฉพาะ <b>แถวรวมล่างสุด</b> · แตะที่ตัวหนังสือเพื่อสั่งโฟกัส'},400)}

/* แตะจอ = สั่งโฟกัสจุดนั้น (เครื่องที่รองรับ) + วงแหวนโฟกัส */
async function tapFocus(e){
  const r=$('scFrame').parentElement.getBoundingClientRect();
  const ring=$('focusRing');
  if(ring){ring.style.left=(e.clientX-r.left)+'px';ring.style.top=(e.clientY-r.top)+'px';
    ring.classList.remove('go');void ring.offsetWidth;ring.classList.add('go')}
  if(!camTrack)return;
  const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  const caps=camTrack.getCapabilities?camTrack.getCapabilities():{};
  try{
    if(caps.pointsOfInterest)
      await camTrack.applyConstraints({advanced:[{pointsOfInterest:[{x,y}]}]});
    if(caps.focusMode&&caps.focusMode.includes('single-shot'))
      await camTrack.applyConstraints({advanced:[{focusMode:'single-shot'}]});
    else if(caps.focusMode&&caps.focusMode.includes('continuous'))
      await camTrack.applyConstraints({advanced:[{focusMode:'continuous'}]});
  }catch(err){}
  steadyBlurTicks=0;
}

async function initCam(){
  const v=$('cam'),pill=$('scPill');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    pill.className='scPill warn';
    pill.innerHTML='เครื่องนี้เปิดกล้องในเบราว์เซอร์ไม่ได้<br>กดปุ่มรูปภาพเพื่อเลือกจากเครื่องแทน';return}
  try{
    camStream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},audio:false});
    v.srcObject=camStream;camTrack=camStream.getVideoTracks()[0];
    try{await camTrack.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    startLive();
  }catch(e){
    pill.className='scPill warn';
    pill.innerHTML=(location.protocol==='https:'||location.hostname==='localhost')
      ?'ยังไม่ได้อนุญาตให้ใช้กล้อง<br><span style="font-size:11.5px;opacity:.9">กดไอคอนซ้ายช่อง URL → อนุญาตกล้อง → เปิดหน้าใหม่</span>'
      :'กล้องใช้ได้เฉพาะเว็บที่เป็น https<br><span style="font-size:11.5px;opacity:.9">กดปุ่มรูปภาพเพื่อเลือกจากเครื่องแทน</span>';
  }
}

/* วิเคราะห์ภาพสดทุก ~200ms : คม / สว่าง / นิ่ง */
function startLive(){
  stopLive();
  const v=$('cam'),c=document.createElement('canvas'),
        x=c.getContext('2d',{willReadFrequently:true}),W=300;
  liveTimer=setInterval(()=>{
    if(!camStream||!v.videoWidth||busyShot)return;
    const pill=$('scPill'),bar=$('scMeter'),lab=$('scLab'),frame=$('scFrame');
    if(!pill)return stopLive();
    const h=Math.max(2,Math.round(v.videoHeight/v.videoWidth*W));
    c.width=W;c.height=h;x.drawImage(v,0,0,W,h);
    const d=x.getImageData(0,0,W,h).data,g=new Float32Array(W*h);let sum=0;
    for(let i=0,p=0;i<d.length;i+=4,p++){const val=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[p]=val;sum+=val}
    const bright=sum/(W*h);
    let m1=0,m2=0,cnt=0;
    for(let y=1;y<h-1;y++)for(let xx=1;xx<W-1;xx++){const p=y*W+xx;
      const l=4*g[p]-g[p-1]-g[p+1]-g[p-W]-g[p+W];m1+=l;m2+=l*l;cnt++}
    const blur=Math.max(0,m2/cnt-(m1/cnt)*(m1/cnt));
    let motion=0;
    if(prevGray&&prevGray.length===g.length){let s2=0;
      for(let i=0;i<g.length;i+=3)s2+=Math.abs(g[i]-prevGray[i]);
      motion=s2/(g.length/3)}
    prevGray=g;

    const pct=Math.round(Math.min(100,blur/(LIVE_BLUR*1.6)*100));
    bar.style.width=Math.max(3,pct)+'%';
    bar.className=pct>=62?'ok':'';
    lab.textContent='ความคมชัด '+pct+'%';

    /* ถือนิ่งแล้วแต่ยังไม่คม = น่าจะเลนส์เปื้อนหรือจ่อใกล้เกินไป */
    const steadyButBlurry=(motion<=7&&blur<LIVE_BLUR);
    steadyBlurTicks=steadyButBlurry?steadyBlurTicks+1:0;

    let msg,cls,ok=false;
    if(bright<45){msg='🌑 มืดไป หาที่สว่างขึ้นหน่อย';cls='warn'}
    else if(bright>238){msg='☀️ สว่างจ้าจนตัวหนังสือหาย เลี่ยงแสงสะท้อน';cls='warn'}
    else if(motion>7){msg='🤚 ถือนิ่ง ๆ อีกนิด';cls=''}
    else if(steadyBlurTicks>18){msg='🧽 ถือนิ่งแล้วแต่ยังไม่คม<br><span style="font-size:12px;font-weight:400">ลองเช็ดเลนส์กล้องด้วยผ้านุ่ม แล้วถอยห่างจากใบสัก 1 ฝ่ามือ</span>';cls='tip'}
    else if(blur<LIVE_BLUR){msg='🔍 ยังเบลอ — แตะที่ตัวหนังสือเพื่อโฟกัส';cls=''}
    else {msg='✅ ชัดแล้ว ถือค้างไว้ กำลังสแกน…';cls='ok';ok=true}

    if(ok&&autoOn)goodRun++;else goodRun=0;
    pill.innerHTML=goodRun>0?msg+' '+'●'.repeat(goodRun):msg;
    pill.className='scPill '+cls;
    frame.classList.toggle('ready',ok);

    if(goodRun>=NEED){busyShot=true;stopLive();
      try{navigator.vibrate&&navigator.vibrate([25,45,25])}catch(e){}
      pill.innerHTML='📸 ภาพชัดพอแล้ว กำลังอ่านข้อมูล…';pill.className='scPill ok';
      setTimeout(()=>grabShot(0,1),140)}
  },200);
}

function grabShot(manual,auto){
  const v=$('cam');
  if(!camStream||!v.videoWidth){busyShot=false;return toast('กล้องยังไม่พร้อม ลองเลือกรูปจากเครื่องแทน')}
  busyShot=true;stopLive();
  shotURL=shrink(v,v.videoWidth,v.videoHeight);
  closeScanner();saveShot();
  analyze(auto?1:0);
}
function fileShot(e){const f=e.target.files&&e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{shotURL=shrink(img,img.naturalWidth,img.naturalHeight);
    URL.revokeObjectURL(img.src);closeScanner();saveShot();analyze()};
  img.onerror=()=>toast('เปิดไฟล์รูปไม่ได้');
  img.src=URL.createObjectURL(f)}

/* ---------- ตรวจรูป แล้วส่งให้ AI อ่าน ---------- */
async function analyze(skipCheck){
  ocrErr=null;
  if(!skipCheck){
    const q=await imgQuality(shotURL);
    if(q.blur<BLUR_MIN) return retake('รูปเบลอเกินไป อ่านตัวเลขไม่ออก',
      'จับมือถือให้นิ่ง แตะที่ตารางเพื่อให้กล้องโฟกัสก่อนกดถ่าย');
    if(q.bright<45) return retake('รูปมืดเกินไป','หาที่สว่างขึ้น หรืออย่าให้เงาตัวเองบังใบ');
    if(q.bright>238) return retake('รูปสว่างจ้าจนตัวหนังสือหาย','เลี่ยงแสงสะท้อนลงบนกระดาษ');
  }
  reading();
  try{
    const r=await fetch('/api/ocr',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({image:shotURL})});
    const j=await r.json().catch(()=>({ok:false,error:'เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ'}));
    if(!j.ok){ocrErr=j;return openShotResult(null)}
    if(j.data&&j.data.readable===false)
      return retake(j.data.problem||'อ่านใบนี้ไม่ออก',j.data.advice||'ลองถ่ายใหม่ให้เห็นตารางครบทั้งใบ',1);
    try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
    toast('✅ อ่านข้อมูลเสร็จแล้ว');
    openShotResult(j.data);
  }catch(e){
    ocrErr={error:'ต่อระบบอ่านเอกสารไม่ได้',
      hint:'ถ้าเปิดไฟล์จากเครื่องตรง ๆ จะยังไม่มีตัวอ่าน ต้องเปิดผ่านลิงก์เว็บที่ deploy ไว้'};
    openShotResult(null);
  }
}

/* ---------- ซูมรูป ---------- */
function openZoom(src){
  if(!src)return;
  const z=document.createElement('div');z.className='zoomer';
  z.innerHTML='<img alt="ใบ OT"><button class="zx">✕</button><div class="zh">สองนิ้วซูม · ลากเลื่อน · แตะสองครั้งรีเซ็ต</div>';
  z.querySelector('img').src=src;document.body.appendChild(z);
  const img=z.querySelector('img');
  let sc=1,tx=0,ty=0,s0=1,d0=0,px=0,py=0,last=0;
  const up=()=>img.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  z.addEventListener('touchstart',e=>{
    if(e.touches.length===2){d0=dist(e.touches);s0=sc}
    else{px=e.touches[0].clientX-tx;py=e.touches[0].clientY-ty;
      const t=Date.now();if(t-last<300){sc=1;tx=0;ty=0;up()}last=t}},{passive:true});
  z.addEventListener('touchmove',e=>{e.preventDefault();
    if(e.touches.length===2&&d0){sc=Math.max(1,Math.min(7,s0*dist(e.touches)/d0))}
    else if(e.touches.length===1&&sc>1){tx=e.touches[0].clientX-px;ty=e.touches[0].clientY-py}
    up()},{passive:false});
  z.querySelector('.zx').onclick=()=>z.remove();
}

function coins(){const tgt=$('hCoin').getBoundingClientRect();
  for(let i=0;i<10;i++){const c=document.createElement('div');c.className='coin';c.textContent='฿';
    const sx=window.innerWidth/2,sy=window.innerHeight*.62;
    c.style.left=sx+'px';c.style.top=sy+'px';document.body.appendChild(c);
    c.animate([{transform:`translate(${(Math.random()-.5)*100}px,${-70-Math.random()*50}px) scale(1.2)`,opacity:1},
      {transform:`translate(${tgt.left-sx}px,${tgt.top-sy}px) scale(.3)`,opacity:0}],
      {duration:900+i*70,easing:'cubic-bezier(.3,-0.2,.5,1)',fill:'forwards'});
    setTimeout(()=>c.remove(),1050+i*70)}
  toast('🪙 เงิน OT เข้าฟาร์มแล้ว!');}
function confetti(){const cs=['#FFD166','#FF8FAB','#7BC96F','#7DD3FC','#A78BFA'];
  for(let i=0;i<34;i++){const p=document.createElement('div');p.className='conf-p';
    p.style.background=cs[i%cs.length];p.style.left=(window.innerWidth/2)+'px';p.style.top='30%';
    document.body.appendChild(p);
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${(Math.random()-.5)*380}px,${180+Math.random()*300}px) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:1300+Math.random()*700,easing:'cubic-bezier(.2,.6,.4,1)',fill:'forwards'});
    setTimeout(()=>p.remove(),2100)}}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)}

/* ---------- ปัดซ้ายเพื่อลบ ---------- */
let swA=null,swX=0,swY=0,swD=0,swLock=0;
function swStart(el,x,y){swA=el;swX=x;swY=y;swD=0;swLock=0;el.querySelector('.fr').style.transition='none'}
function swMove(x,y){if(!swA)return;const dx=x-swX,dy=y-swY;
  if(!swLock){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;swLock=Math.abs(dx)>Math.abs(dy)?1:-1;
    if(swLock<0){swEnd();return}}
  swD=dx;const base=swA.classList.contains('open')?-88:0;
  swA.querySelector('.fr').style.transform='translateX('+Math.max(-88,Math.min(0,base+dx))+'px)'}
function swEnd(){if(!swA)return;const fr=swA.querySelector('.fr');fr.style.transition='';fr.style.transform='';
  if(swD<-30)swA.classList.add('open');else if(swD>30)swA.classList.remove('open');swA=null;swLock=0;swD=0}
document.addEventListener('touchmove',e=>{if(swA)swMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
document.addEventListener('touchend',swEnd);
document.addEventListener('mousemove',e=>{if(swA)swMove(e.clientX,e.clientY)});
document.addEventListener('mouseup',swEnd);
function bindSwipe(){document.querySelectorAll('.sw .fr').forEach(fr=>{
  if(fr.dataset.b)return;fr.dataset.b=1;
  fr.addEventListener('touchstart',e=>swStart(fr.parentElement,e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  fr.addEventListener('mousedown',e=>{e.preventDefault();swStart(fr.parentElement,e.clientX,e.clientY)})})}

document.querySelectorAll('.spot').forEach(sp=>{
  sp.addEventListener('click',()=>{
    const ping=sp.querySelector('.ping');
    if(ping){ping.style.animation='none';ping.getBoundingClientRect();ping.style.animation='pingA .55s ease-out'}
    openSheet(sp.dataset.open)});
});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  if(b.dataset.nav!=='scan')document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));
  if(b.dataset.nav==='scan'){b.classList.remove('on');
    document.querySelector('.nav [data-nav="farm"]').classList.add('on');startScan();return}
  if(b.dataset.nav==='farm')closeSheet();else openSheet(b.dataset.nav)});

  l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(MANIFEST));
